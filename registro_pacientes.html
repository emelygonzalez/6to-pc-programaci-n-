        <input type="email" placeholder="Ingrese el correo">

        <input type="tel" placeholder="Ingrese el teléfono">

        <label>Dirección</label>
        <textarea placeholder="Ingrese la dirección"></textarea>

        <button type="submit">Guardar</button>
    </form>
