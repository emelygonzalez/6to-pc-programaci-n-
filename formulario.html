<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>

    <h1>Inscripción Congreso Tecnológico</h1>

    <form action="">

        <label for="">Nombre completo</label><br>
        <input type="text" placeholder="Ingrese su nombre completo"><br><br>

        <label for="">Correo electrónico</label><br>
        <input type="email" placeholder="Ingrese su correo"><br><br>

        <label for="">Teléfono</label><br>
        <input type="tel" placeholder="Ingrese su teléfono"><br><br>

        <label for="">Fecha de nacimiento</label><br>
        <input type="date"><br><br>

        <label for="">Carrera</label><br>
        <select>
            <option>Seleccione una carrera</option>
            <option>Ingeniería en Sistemas</option>
            <option>Ingeniería Industrial</option>
            <option>Administración de Empresas</option>
            <option>Contaduría Pública</option>
        </select><br><br>

        <label for="">Jornada preferida</label><br>
        <input type="radio" name="jornada"> Matutina<br>
        <input type="radio" name="jornada"> Vespertina<br>
        <input type="radio" name="jornada"> Nocturna<br><br>

        <label for="">Áreas de interés</label><br>
        <input type="checkbox"> Programación<br>
        <input type="checkbox"> Robótica<br>
        <input type="checkbox"> Inteligencia Artificial<br>
        <input type="checkbox"> Ciberseguridad<br><br>

        <label for="">Fotografía del participante</label><br>
        <input type="file"><br><br>

        <label for="">Color para su gafete</label><br>
        <input type="color"><br><br>

        <label for="">Nivel de conocimientos en informática (1 a 10)</label><br>
        <input type="range" min="1" max="10"><br><br>

        <label for="">Comentarios adicionales</label><br>
        <textarea rows="5" cols="30"></textarea><br><br>

        <input type="submit" value="Registrar">
        <input type="reset" value="Limpiar">

    </form>
